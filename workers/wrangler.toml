# Cloudflare Workers — wrangler.toml
name = "rsp-api"
main = "entry.ts"
compatibility_date = "2026-06-02"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.image-editor.co/*", zone_name = "image-editor.co" }
]

# D1 binding
[[d1_databases]]
binding = "DB"
database_name = "rsp-db"
database_id = "93658231-c023-47d1-8839-1058283a724f"

# KV bindings
[[kv_namespaces]]
binding = "SESSIONS"
id = "48712c55221f467aa1d25bd6b2522fac"

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "864c39c2ce244d11866532fc8784dca9"

# R2 bindings
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "image-editor-assets"

[[r2_buckets]]
binding = "OUTPUTS"
bucket_name = "image-editor-assets"

[vars]
# AI provider selection
# "fal"             → fal.ai GPT Image 2 (RECOMMENDED — real implementation ready)
# "cf-workers-ai"   → Cloudflare Workers AI (placeholder, model TBD)
# "replicate"       → Replicate (placeholder, model/version TBD)
# "cloudinary"      → Cloudinary (placeholder, transform TBD)
AI_PROVIDER = "fal"

# FAL_KEY is the fal.ai API key.
# Set via: npx wrangler secret put FAL_KEY
# (value stored in Cloudflare, never in code or wrangler.toml)
FAL_KEY = ""

# Dedicated rembg service for remove-bg mode.
# REMBG_API_KEY is a Wrangler secret; do not commit it.
REMBG_API_URL = "http://43.137.51.88:8000"
REMBG_MODEL = "general"